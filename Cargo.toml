# ityv workspace. Every crate under crates/ is trusted computing base (TCB) and
# inherits the lint set below without exception (CONSTITUTION.md §1.1).
[workspace]
resolver = "3"
members = ["crates/ityv-encoding", "crates/ityv-crypto"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/dudueul/ityv"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
# `cfg(kani)` is set by `cargo kani`; declare it so the lint still catches typos.
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
# Groups first (lower priority so the explicit entries below win on conflicts).
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Restriction lints demanded by CONSTITUTION.md §1.1.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
float_arithmetic = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
wildcard_enum_match_arm = "deny"
exit = "deny"
std_instead_of_core = "deny"
alloc_instead_of_core = "deny"
missing_panics_doc = "deny"
missing_errors_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.dev]
overflow-checks = true
debug-assertions = true

# Dependencies (the cryptographic backends above all) are optimized even in
# debug builds: SLH-DSA-SHAKE-256s signing and ML-DSA-87 key expansion are
# otherwise too slow for the test and mutation suites. Workspace crates keep
# opt-level 0 with overflow checks and debug assertions.
[profile.dev.package."*"]
opt-level = 3

[profile.test]
overflow-checks = true
debug-assertions = true

[profile.test.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true
debug-assertions = false
panic = "abort"
lto = "fat"
codegen-units = 1
strip = "none"
