<text x="610" y="130" class="h2" >부품 목록</text>
<circle cx="619" cy="148" r="8" class="thin" />
<text x="619" y="152" text-anchor="middle" style="font-size:11px">1</text>
<text x="634" y="152" >투입 후드</text>
<text x="790" y="152" class="s" >봉투의 열린 끝만 받음</text>
<circle cx="619" cy="167" r="8" class="thin" />
<text x="619" y="171" text-anchor="middle" style="font-size:11px">2</text>
<text x="634" y="171" >급지 롤러·역회전 패드</text>
<text x="790" y="171" class="s" >한 장씩 뗌. 거꾸로도 돎</text>
<circle cx="619" cy="186" r="8" class="thin" />
<text x="619" y="190" text-anchor="middle" style="font-size:11px">3</text>
<text x="634" y="190" >초음파 겹침 감지</text>
<text x="790" y="190" class="s" >겹치면 판독 전 멈춤·되돌림</text>
<circle cx="619" cy="205" r="8" class="thin" />
<text x="619" y="209" text-anchor="middle" style="font-size:11px">4</text>
<text x="634" y="209" >양면 CIS</text>
<text x="790" y="209" class="s" >RGB 300dpi, 위·아래</text>
<circle cx="619" cy="224" r="8" class="thin" />
<text x="619" y="228" text-anchor="middle" style="font-size:11px">5</text>
<text x="634" y="228" >대기 구역 (escrow)</text>
<text x="790" y="228" class="s" >최대 8장, 순서 보관</text>
<circle cx="619" cy="243" r="8" class="thin" />
<text x="619" y="247" text-anchor="middle" style="font-size:11px">6</text>
<text x="634" y="247" >바닥 픽업 롤러·게이트</text>
<text x="790" y="247" class="s" >맨 아래 장부터 (가정)</text>
<circle cx="619" cy="262" r="8" class="thin" />
<text x="619" y="266" text-anchor="middle" style="font-size:11px">7</text>
<text x="634" y="266" >각인 헤드</text>
<text x="790" y="266" class="s" >열 잉크젯·안료, 고정 위치</text>
<circle cx="619" cy="281" r="8" class="thin" />
<text x="619" y="285" text-anchor="middle" style="font-size:11px">8</text>
<text x="634" y="285" >3방향 분기기</text>
<text x="790" y="285" class="s" >투표함 · 폐기함 · 반환</text>
<circle cx="619" cy="300" r="8" class="thin" />
<text x="619" y="304" text-anchor="middle" style="font-size:11px">9</text>
<text x="634" y="304" >투표함</text>
<text x="790" y="304" class="s" >넣는 표</text>
<circle cx="619" cy="319" r="8" class="thin" />
<text x="619" y="323" text-anchor="middle" style="font-size:11px">10</text>
<text x="634" y="323" >폐기함</text>
<text x="790" y="323" class="s" >확인한 표 (각인 없음)</text>
<circle cx="619" cy="338" r="8" class="thin" />
<text x="619" y="342" text-anchor="middle" style="font-size:11px">11</text>
<text x="634" y="342" >반환 트레이</text>
<text x="790" y="342" class="s" >관외·재외 프로필</text>
<circle cx="619" cy="357" r="8" class="thin" />
<text x="619" y="361" text-anchor="middle" style="font-size:11px">12</text>
<text x="634" y="361" >장 수 센서</text>
<text x="790" y="361" class="s" >대기 구역 장 수 (가정)</text>
<circle cx="619" cy="376" r="8" class="thin" />
<text x="619" y="380" text-anchor="middle" style="font-size:11px">13</text>
<text x="634" y="380" >비상 투입 슈트</text>
<text x="790" y="380" class="s" >오른쪽 반, 숨은선</text>
<text x="620" y="440" class="h2" >투표지 방향 (축척 없음)</text>
<rect x="640" y="470" width="60" height="170" rx="3" class="chm" />
<rect x="645" y="476" width="50" height="150" rx="0" class="paper" />
<rect x="645" y="617" width="50" height="9" rx="0" class="tcb" />
<text x="670" y="462" class="s" text-anchor="middle" >봉투 110 × 320</text>
<line x1="670" y1="646" x2="670" y2="684" class="one" marker-end="url(#at)" />
<text x="670" y="700" class="s" text-anchor="middle" >장치로</text>
<circle cx="695" cy="621" r="2.2" class="dot" />
<path d="M695,621 L722,606" class="dim" />
<text x="726" y="610" class="s" >각인 구역 (하단 18mm)</text>
<text x="726" y="625" class="s" >열린 끝 쪽 → 먼저 들어감</text>
<circle cx="670" cy="510" r="2.2" class="dot" />
<path d="M670,510 L722,506" class="dim" />
<text x="726" y="510" class="s" >윗변부터 넣음</text>
<text x="726" y="525" class="s" >기표면은 봉투 안쪽</text>
<circle cx="695" cy="476" r="2.2" class="dot" />
<path d="M695,476 L722,552" class="dim" />
<text x="726" y="556" class="s" >봉투 세 변은 닫힘</text>
<text x="620" y="720" class="s" >긴 투표지(최대 600)는 110 × 560 봉투, 같은 경로.</text>
<text x="620" y="736" class="s" >대기 구역 길이 640은 이것 때문이다 (DEVICES §3.2).</text>
<text x="960" y="130" class="h2" >방문 하나의 처리 순서</text>
<text x="960" y="152" class="s" >1.</text>
<text x="978" y="152" >봉투째 1에 넣는다. 2가 한 장씩 떼고 3이 겹침을 본다.</text>
<text x="978" y="170" class="s" >겹치면 판독 전에 멈추고 되돌린다. 기록이 생기지 않는다.</text>
<text x="960" y="188" class="s" >2.</text>
<text x="978" y="188" >4가 양면을 읽고 종이는 5에 쌓인다. 해석 유닛은 장마다</text>
<text x="978" y="206" class="s" >Interpretation만 단방향으로 보낸다 (D-03).</text>
<text x="960" y="224" class="s" >3.</text>
<text x="978" y="224" >다 넣으면 해석 유닛이 VisitEnd(장 수)를 보낸다.</text>
<text x="960" y="242" class="s" >4.</text>
<text x="978" y="242" >커밋먼트 유닛이 모든 위치를 커밋·서명하고 저널에 묶은</text>
<text x="978" y="260" class="s" >뒤에만 화면 단추를 켠다 (VC-068).</text>
<text x="960" y="278" class="s" >5.</text>
<text x="978" y="278" >유권자가 모두 넣기 또는 확인할 장 고르기를 누른다.</text>
<text x="978" y="296" class="s" >결정이 저널에 영속화된 뒤에야 종이가 움직인다.</text>
<text x="960" y="314" class="s" >6.</text>
<text x="978" y="314" >6이 위치 순서대로 한 장씩 꺼낸다.</text>
<text x="978" y="332" class="s" >넣는 장: 7 각인 → 8 → 9 (관외·재외는 → 11)</text>
<text x="978" y="350" class="s" >확인하는 장: 각인 없이 8 → 10</text>
<text x="960" y="368" class="s" >7.</text>
<text x="978" y="368" >확인 결과는 화면이 아니라 인쇄물 출구로 나온다 (D-01 5).</text>
<text x="960" y="396" class="h2" >다른 경우</text>
<text x="960" y="416" >확인 카드: 3·4를 지나 QR만 읽힌 뒤 2가 거꾸로 돌아 1로 되돌린다.</text>
<text x="978" y="434" class="s" >투표함에 들어가지 않는다 (PROTOCOL §7.9, D-08).</text>
<text x="960" y="452" >정전: 내장 전지로 지금 방문을 마무리한다. 재개는 저널 순서와</text>
<text x="978" y="470" class="s" >대기 구역 순서가 같아야 한다 (DEVICES §3.2, P1).</text>
<text x="960" y="488" >걸림: 사무원이 열기 전에 참관인 2인이 입회한다 (가정).</text>
<line x1="960" y1="636" x2="986" y2="636" class="one" marker-end="url(#at)" />
<text x="994" y="640" class="s" >종이 경로 (기본)</text>
<line x1="960" y1="656" x2="986" y2="656" class="oned" marker-end="url(#at)" />
<text x="994" y="660" class="s" >종이 경로 (조건부: 폐기·반환)</text>
<rect x="960" y="670" width="26" height="13" rx="0" class="unt" />
<text x="994" y="680" class="s" >불신 센서·헤드</text>
<rect x="960" y="690" width="26" height="13" rx="0" class="tcb" />
<text x="994" y="700" class="s" >겹침 감지기 · 각인 구역</text>
<rect x="960" y="710" width="26" height="13" rx="0" class="chm" />
<text x="994" y="720" class="s" >가림 봉투</text>
<text x="24" y="862" class="h2" >주</text>
<text x="24" y="880" class="s" >1. 모든 치수와 기울기, 픽업 방식은 가정이다. M8에서 급지·겹침·걸림률을 재서 정한다 (DEVICES §8).</text>
<text x="24" y="896" class="s" >2. 12의 장 수를 VisitEnd의 장 수와 맞춰 볼지는 M8에서 정한다 (가정, 명세 아님).</text>
<text x="24" y="912" class="s" >3. 각인 위치·글꼴·농도는 고정이고 바꿀 설정이 없다 (BALLOT_LAYOUT §9).</text>
<rect x="954" y="812" width="430" height="132" rx="0" class="box" />
<text x="962" y="832" class="s" >도면 번호</text>
<text x="1046" y="832" >D-02</text>
