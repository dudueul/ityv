<text x="962" y="852" class="s" >이름</text>
<text x="1046" y="852" class="h2" >투함 스캐너 종이 경로 단면</text>
<line x1="954" y1="857" x2="1384" y2="857" class="thin" />
<text x="962" y="872" class="s" >축척 · 단위</text>
<text x="1046" y="872" >축척 없음 (치수 기입) · mm</text>
<line x1="954" y1="877" x2="1384" y2="877" class="thin" />
<text x="962" y="892" class="s" >판 · 날짜</text>
<text x="1046" y="892" >1판 (연구용 초안) · 2026-11-01</text>
