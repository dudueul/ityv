<text x="24" y="34" class="h" >D-02 · 투함 스캐너 종이 경로 단면 (종이 경로 면에서 자름)</text>
<text x="24" y="54" class="s" >앞(유권자)은 왼쪽, 뒤(사무원)는 오른쪽. 종이 경로는 폭 방향 왼쪽 반에, 전자부는 오른쪽 반에 있다 (D-03).</text>
<text x="24" y="70" class="s" >번호는 가운데 부품 목록, 오른쪽은 방문 하나의 처리 순서.</text>
