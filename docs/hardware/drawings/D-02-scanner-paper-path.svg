<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960">
<title>D-02 투함 스캐너 종이 경로 단면</title>
<desc>투입 후드부터 급지, 겹침 감지, 양면 판독, 대기 구역, 각인, 분기까지 종이 경로를 종이 경로 면에서 자른 개념 단면. 치수는 가정이다.</desc>
