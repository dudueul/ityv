<text x="270" y="548" class="s" text-anchor="middle" >칩 계열 표시</text>
<text x="270" y="566" class="s" text-anchor="middle" >(인쇄 라벨, 가정)</text>
<rect x="390" y="466" width="70" height="152" rx="0" class="seal" />
<text x="425" y="545" class="red" text-anchor="middle" style="font-size:11px">번호 봉인</text>
