<text x="945" y="188" class="h2" text-anchor="middle" >MCU</text>
<text x="945" y="206" class="s" text-anchor="middle" >M33급</text>
<rect x="1000" y="162" width="44" height="44" rx="3" class="unt" />
<text x="1022" y="188" class="s" text-anchor="middle" >SE</text>
<circle cx="880" cy="192" r="38" class="ext" />
<text x="880" y="240" class="s" text-anchor="middle" >코인 전지 (뒷면)</text>
<rect x="1065" y="172" width="26" height="26" rx="2" class="box" />
<circle cx="1078" cy="185" r="7" class="thin" />
<text x="1078" y="220" class="s" text-anchor="middle" >변조 스위치</text>
<rect x="1150" y="147" width="102" height="90" rx="2" class="box" />
<rect x="1160" y="162" width="92" height="60" rx="2" class="chm" />
<text x="1206" y="196" class="s" text-anchor="middle" >패드 카드 소켓</text>
<circle cx="1110" cy="152" r="2.5" class="thin" />
<circle cx="1124" cy="161" r="2.5" class="thin" />
<circle cx="1110" cy="170" r="2.5" class="thin" />
<circle cx="1124" cy="179" r="2.5" class="thin" />
<circle cx="1110" cy="188" r="2.5" class="thin" />
<text x="1116" y="248" class="s" text-anchor="middle" >디버그 패드</text>
<text x="1036" y="274" class="s" text-anchor="middle" >72 × 20 기판 (가정). SE 자리는 확인 장치 정당 모듈만 실장</text>
<text x="800" y="302" >MCU: LPC55S69 · STM32U5/H5 · nRF54L 중 하나, 정당마다 다른 계열</text>
<text x="800" y="318" class="s" >기기 고유 키(PUF/HUK/KMU)로 키 영역 암호화, TrustZone 보안 영역</text>
<text x="800" y="334" class="s" >디버그 패드: 출하 뒤 영구 잠금 + 판독 보호 최고 단계</text>
<text x="800" y="350" class="s" >칩 난수원 + 챔버 엔트로피로 모듈 안에서 키 생성 (§5.1)</text>
<text x="800" y="400" class="h2" >모듈 변형</text>
<text x="800" y="422" class="s" ></text>
<text x="950" y="422" >스캐너 챔버 모듈</text>
<text x="1180" y="422" >확인 장치 정당 모듈</text>
<line x1="800" y1="428" x2="1380" y2="428" class="thin" />
<text x="800" y="446" class="s" >수량 (지선, n=4)</text>
<text x="950" y="446" >칸 7개 × 약 25,300대</text>
<text x="1180" y="446" >n개 × 약 18,700 유닛</text>
<text x="800" y="464" class="s" >보안 칩 (SE)</text>
<text x="950" y="464" >없음</text>
<text x="1180" y="464" >SE050급, PRF 키 (HMAC)</text>
<text x="800" y="482" class="s" >하는 일</text>
<text x="950" y="482" >난수·ID·라벨 기여, 패드</text>
<text x="1180" y="482" >가명 PRF, 카운터 서명</text>
<text x="800" y="500" class="s" >패드 카드</text>
<text x="950" y="500" >있음 (선거마다 교체)</text>
<text x="1180" y="500" >없음 (가정)</text>
<text x="800" y="518" class="s" >변조 스위치</text>
<text x="950" y="518" >있음</text>
<text x="1180" y="518" >있음</text>
<text x="40" y="740" class="h2" >스캐너 모듈 칸 (정면, 문 연 상태)</text>
<rect x="60" y="754" width="470" height="60" rx="4" class="box" />
<rect x="74" y="764" width="52" height="40" rx="3" class="chm" />
<text x="100" y="789" text-anchor="middle" style="font-weight:700">P1</text>
<rect x="94" y="800" width="12" height="4" rx="0" class="dot" />
<rect x="138" y="764" width="52" height="40" rx="3" class="chm" />
<text x="164" y="789" text-anchor="middle" style="font-weight:700">P2</text>
<rect x="158" y="800" width="12" height="4" rx="0" class="dot" />
<rect x="202" y="764" width="52" height="40" rx="3" class="chm" />
<text x="228" y="789" text-anchor="middle" style="font-weight:700">P3</text>
<rect x="222" y="800" width="12" height="4" rx="0" class="dot" />
<rect x="266" y="764" width="52" height="40" rx="3" class="chm" />
<text x="292" y="789" text-anchor="middle" style="font-weight:700">P4</text>
<rect x="286" y="800" width="12" height="4" rx="0" class="dot" />
<rect x="330" y="764" width="52" height="40" rx="3" class="chm" />
<text x="356" y="789" text-anchor="middle" style="font-weight:700">J</text>
<rect x="350" y="800" width="12" height="4" rx="0" class="dot" />
<rect x="394" y="764" width="52" height="40" rx="3" class="chm" />
<text x="420" y="789" text-anchor="middle" style="font-weight:700">A</text>
<rect x="414" y="800" width="12" height="4" rx="0" class="dot" />
<rect x="458" y="764" width="52" height="40" rx="3" class="chm" />
<text x="484" y="789" text-anchor="middle" style="font-weight:700">C</text>
<rect x="478" y="800" width="12" height="4" rx="0" class="dot" />
<text x="60" y="832" class="s" >칸마다 키 홈으로 방향 고정, 칸 번호 = 챔버 코드(1–7). n &lt; 4이면 P3·P4 빈 칸 막이 (가정).</text>
<text x="800" y="560" class="h2" >보호 층 (KEY_STORAGE §5.2)</text>
<text x="800" y="582" >기기 고유 키</text>
<text x="910" y="582" class="s" >키 영역·패드 카드를 칩 고유 키로 암호화</text>
<text x="800" y="600" >분리</text>
<text x="910" y="600" class="s" >키 코드와 데이터는 TrustZone 보안 영역에만</text>
<text x="800" y="618" >디버그·판독</text>
<text x="910" y="618" class="s" >출하 뒤 영구 잠금, 판독 보호 최고 단계</text>
<text x="800" y="636" >글리치·변조</text>
<text x="910" y="636" class="s" >전압·클록·온도 감지 → 키 영역 지움</text>
<text x="800" y="654" >변조 스위치</text>
<text x="910" y="654" class="s" >외함이 열리면 키 지움. 선거 기간에만 전지</text>
<text x="800" y="672" >패드 카드</text>
<text x="910" y="672" class="s" >쓰자마자 0으로 덮음 (VC-034), 끝나면 파쇄</text>
<text x="800" y="690" >봉인·인계</text>
<text x="910" y="690" class="s" >번호 봉인 가방, CustodyHandoff, 두 사람 규칙</text>
<text x="620" y="728" class="h2" >부품</text>
<text x="620" y="748" class="s" >1 번호 봉인 (윗면 이음매)</text>
<text x="620" y="763" class="s" >2 위 외함</text>
<text x="620" y="778" class="s" >3 MCU (Cortex-M33급)</text>
<text x="620" y="793" class="s" >4 SE 자리 (변형)</text>
<text x="620" y="808" class="s" >5 변조 스위치</text>
<text x="620" y="823" class="s" >6 패드 카드 소켓</text>
<text x="795" y="748" class="s" >7 코인 전지 (CR1220, 가정)</text>
<text x="795" y="763" class="s" >8 커넥터 (USB-A 모양, 가정)</text>
<text x="795" y="778" class="s" >9 아래 외함 · 이음매 봉인</text>
<text x="795" y="793" class="s" >10 패드 카드 (NOR 256–512Mb)</text>
<text x="795" y="808" class="s" >11 전원·ESD 부품</text>
<text x="24" y="862" class="h2" >주</text>
<text x="24" y="880" class="s" >1. 모든 치수, 커넥터 모양, 코인 전지 규격은 가정이다. 전기 규격은 장치 안 모듈 버스이며 USB 프로토콜을 뜻하지 않는다.</text>
<text x="24" y="896" class="s" >2. 보안 칩은 스캐너 모듈에 두지 않는다 (ML-DSA 키를 넣지 못해 얻는 것이 없다. DEVICES §5.1).</text>
<text x="24" y="912" class="s" >3. 모듈 하나가 뚫리는 것은 그 챔버의 공모와 같고 접근구조가 견딘다 (ADR-0019). 분실·봉인 훼손은 사건이다 (§5.5).</text>
