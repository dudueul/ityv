<text x="24" y="34" class="h" >D-04 · 챔버 모듈 분해도 (USB 모양 공개 MCU 모듈)</text>
<text x="24" y="54" class="s" >스캐너의 챔버 모듈과 확인 장치의 정당 모듈은 같은 기판이다. 보안 칩(SE)은 확인 장치 정당 모듈에만 붙인다 (ADR-0024).</text>
<text x="24" y="70" class="s" >치수는 모두 가정(mm). 분해 측면도와 기판 배치는 1mm = 6px로 그렸다.</text>
