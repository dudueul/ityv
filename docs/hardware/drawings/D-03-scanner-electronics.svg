.tcb { stroke: var(--teal); fill: var(--fill2); stroke-width: 1.6; }
.unt { stroke: var(--muted); fill: var(--fill); stroke-width: 1.4; stroke-dasharray: 6 4; }
.chm { stroke: var(--gold); fill: var(--chm); stroke-width: 1.6; }
