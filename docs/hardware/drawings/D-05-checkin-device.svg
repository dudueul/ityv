<text x="545" y="409" class="s" text-anchor="middle" >SE</text>
<text x="545" y="438" class="s" text-anchor="middle" >PRF</text>
<rect x="580" y="360" width="50" height="90" rx="3" class="chm" />
<text x="605" y="378" text-anchor="middle" style="font-weight:700">P4</text>
<rect x="589" y="392" width="32" height="24" rx="2" class="unt" />
<text x="605" y="409" class="s" text-anchor="middle" >SE</text>
<text x="605" y="438" class="s" text-anchor="middle" >PRF</text>
