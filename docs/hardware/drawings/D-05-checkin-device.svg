<text x="404" y="242" class="s" >입력 1–4: 수광부만</text>
<text x="404" y="262" class="s" >ityv-core, no_std Rust, 힙 없음</text>
<text x="404" y="278" class="s" >가명 결합 (§6.4) · seq · 서명</text>
<text x="404" y="294" class="s" >voter_id는 서명 뒤 지움 (VC-015)</text>
<text x="404" y="310" class="s" >봉인 저널: CheckinCounter</text>
<text x="404" y="326" class="s" >광 송신 4 프레임 / 10분</text>
