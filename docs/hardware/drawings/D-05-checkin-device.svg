<text x="24" y="872" class="h2" >주</text>
<text x="24" y="890" class="s" >1. 유닛 외형과 치수, 화면 크기, 입력 포트 수는 가정이다. 단말 수가 4를 넘으면 입력을 늘린다 (가정).</text>
<text x="24" y="906" class="s" >2. 정당 모듈이 하나라도 빠지면 가명을 계산할 수 없다. 유닛 교체는 CheckinUnitSwap으로 순번을 이어받는다 (§6.2).</text>
