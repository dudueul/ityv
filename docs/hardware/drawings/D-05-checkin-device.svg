<text x="24" y="34" class="h" >D-05 · 확인 장치 (신원 확인 단말 + 카운터·가명 유닛)</text>
<text x="24" y="54" class="s" >투표소마다 카운터·가명 유닛 하나와 봉인 예비 하나. 단말은 여러 대이며 유닛으로 한 방향으로만 넘긴다 (PROTOCOL §5.8 2항, §6.2).</text>
<text x="24" y="70" class="s" >번호는 오른쪽 표와 같다.</text>
<rect x="60" y="92" width="300" height="46" rx="3" class="unt" />
<text x="68" y="110" class="h2" >통합선거인명부 (TCB 밖)</text>
<text x="68" y="127" class="s" >투표 여부 조회·표시</text>
<rect x="40" y="150" width="860" height="372" rx="6" class="ln" />
