<line x1="650" y1="226" x2="680" y2="226" class="one" marker-end="url(#at)" />
<rect x="680" y="342" width="110" height="40" rx="3" class="tcb" />
<text x="735" y="360" class="s" text-anchor="middle" >광 송신기</text>
<text x="735" y="375" class="s" text-anchor="middle" >수신 소자 없음</text>
<line x1="650" y1="362" x2="680" y2="362" class="one" marker-end="url(#at)" />
<line x1="790" y1="362" x2="830" y2="362" class="one" marker-end="url(#at)" />
<circle cx="812" cy="346" r="9" class="box" />
<text x="812" y="350" text-anchor="middle" style="font-size:11px;font-weight:700">4</text>
<rect x="830" y="336" width="62" height="52" rx="3" class="box" />
<text x="861" y="358" class="s" text-anchor="middle" >게이트</text>
<text x="861" y="373" class="s" text-anchor="middle" >웨이</text>
<rect x="680" y="400" width="110" height="54" rx="3" class="box" />
<text x="688" y="418" class="h2" >예비 유닛</text>
<text x="688" y="435" class="s" >봉인 보관</text>
