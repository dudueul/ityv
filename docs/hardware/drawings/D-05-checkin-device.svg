<text x="322.8" y="643.2" class="s" text-anchor="middle" >P4</text>
<circle cx="117.0" cy="601.2" r="5" class="seal" />
<circle cx="355.0" cy="601.2" r="5" class="seal" />
<text x="236.0" y="682.4" class="s" text-anchor="middle" >모듈 칸 덮개 (번호 봉인)</text>
<line x1="96" y1="788.0" x2="96" y2="824" class="ext" />
<line x1="376.0" y1="788.0" x2="376.0" y2="824" class="ext" />
<line x1="96" y1="820" x2="376.0" y2="820" class="dim" marker-end="url(#ad)" marker-start="url(#ad)" />
<text x="236.0" y="816" class="s" text-anchor="middle" >200 (가정)</text>
<line x1="94" y1="590" x2="80" y2="590" class="ext" />
<line x1="94" y1="786.0" x2="80" y2="786.0" class="ext" />
<line x1="84" y1="590" x2="84" y2="786.0" class="dim" marker-end="url(#ad)" marker-start="url(#ad)" />
<text x="78" y="692.0" class="s" text-anchor="end" >140 (가정)</text>
<text x="236.0" y="846" class="s" text-anchor="middle" >평면 (뒤쪽이 위)</text>
<rect x="450" y="610" width="280.0" height="77.0" rx="6" class="box" />
<rect x="469.6" y="638.0" width="16.799999999999997" height="19.599999999999998" rx="2" class="box" />
<rect x="494.8" y="638.0" width="16.799999999999997" height="19.599999999999998" rx="2" class="box" />
<rect x="520.0" y="638.0" width="16.799999999999997" height="19.599999999999998" rx="2" class="box" />
<rect x="545.2" y="638.0" width="16.799999999999997" height="19.599999999999998" rx="2" class="box" />
<text x="520.0" y="680.0" class="s" text-anchor="middle" >입력 1–4 (수광부만)</text>
<circle cx="604.0" cy="647.8" r="6" class="tcb" />
<text x="604.0" y="680.0" class="s" text-anchor="middle" >광 송신</text>
<rect x="643.2" y="638.0" width="25.2" height="16.799999999999997" rx="2" class="box" />
<circle cx="655.8" cy="629.6" r="5" class="seal" />
<text x="657.2" y="680.0" class="s" text-anchor="middle" >정비 (봉인)</text>
<rect x="690.8" y="635.2" width="25.2" height="25.2" rx="2" class="box" />
<text x="703.4" y="680.0" class="s" text-anchor="middle" >전원</text>
<line x1="732.0" y1="610" x2="748.0" y2="610" class="ext" />
<line x1="732.0" y1="687.0" x2="748.0" y2="687.0" class="ext" />
<line x1="744.0" y1="610" x2="744.0" y2="687.0" class="dim" marker-end="url(#ad)" marker-start="url(#ad)" />
<text x="750.0" y="652.5" class="s" >55 (가정)</text>
<text x="590.0" y="707.0" class="s" text-anchor="middle" >배면</text>
<text x="450" y="744" class="s" >단말 입력에는 수광부만 있어 유닛에서 단말로 돌아가는 길이 없다.</text>
<text x="450" y="760" class="s" >유닛 화면과 토큰은 유닛에 바로 이어진다.</text>
<text x="940" y="112" class="h2" >무엇이 어디로 가나</text>
<circle cx="949" cy="136" r="9" class="box" />
<text x="949" y="140" text-anchor="middle" style="font-size:11px;font-weight:700">1</text>
<text x="966" y="140" >단말 → 유닛</text>
<text x="966" y="155" class="s" >한 방향 광커플러 · voter_id, 투표양식 (가정)</text>
<circle cx="949" cy="172" r="9" class="box" />
<text x="949" y="176" text-anchor="middle" style="font-size:11px;font-weight:700">2</text>
<text x="966" y="176" >유닛 ↔ 정당 모듈</text>
<text x="966" y="191" class="s" >장치 안 버스 · PRF 요청과 32바이트 출력, 서명</text>
<circle cx="949" cy="208" r="9" class="box" />
<text x="949" y="212" text-anchor="middle" style="font-size:11px;font-weight:700">3</text>
<text x="966" y="212" >유닛 → 봉인 저널</text>
<text x="966" y="227" class="s" >CheckinCounter (restricted: seq·15분 구간·가명)</text>
<circle cx="949" cy="244" r="9" class="box" />
<text x="949" y="248" text-anchor="middle" style="font-size:11px;font-weight:700">4</text>
<text x="966" y="248" >유닛 → 게이트웨이</text>
<text x="966" y="263" class="s" >한 방향 광 · ObserverCountAttest, ParticipationSet</text>
<circle cx="949" cy="280" r="9" class="box" />
<text x="949" y="284" text-anchor="middle" style="font-size:11px;font-weight:700">5</text>
<text x="966" y="284" >단말 ↔ 명부</text>
<text x="966" y="299" class="s" >사전투표만 · 조회 실패면 교부 안 함 (VC-061)</text>
<circle cx="949" cy="316" r="9" class="box" />
<text x="949" y="320" text-anchor="middle" style="font-size:11px;font-weight:700">6</text>
<text x="966" y="320" >토큰 → 유닛</text>
<text x="966" y="335" class="s" >참관인 공동 서명, 현장 증명 도전값</text>
<text x="940" y="372" class="s" >선거일 단말은 연결이 없다 (명부는 종이에 사전투표자 표시).</text>
<text x="940" y="410" class="h2" >확인 한 번의 순서</text>
<text x="940" y="432" class="s" >1.</text>
<text x="958" y="432" >단말이 신분증을 확인한다. 사전투표면 명부에 투표 여부를</text>
<text x="958" y="449" class="s" >조회하고 표시한다.</text>
<text x="940" y="466" class="s" >2.</text>
<text x="958" y="466" >단말이 voter_id를 1로 넘긴다. 되돌아오는 선은 없다.</text>
<text x="940" y="483" class="s" >3.</text>
<text x="958" y="483" >유닛이 정당 모듈마다 PRF를 요청한다. 각 모듈의 보안 칩이</text>
<text x="958" y="500" class="s" >HMAC-SHA-256을 칩 안에서 계산한다 (ADR-0024).</text>
<text x="940" y="517" class="s" >4.</text>
<text x="958" y="517" >유닛이 n개 출력을 챔버 코드 순으로 이어 가명을 만든다.</text>
<text x="940" y="534" class="s" >5.</text>
<text x="958" y="534" >seq를 올리고 CheckinCounter에 유닛·모듈이 서명해 봉인</text>
<text x="958" y="551" class="s" >저널에 둔다. voter_id를 지운다.</text>
<text x="940" y="568" class="s" >6.</text>
<text x="958" y="568" >50건 또는 2시간마다 참관인 2인이 토큰으로</text>
<text x="958" y="585" class="s" >ObserverCountAttest에 서명한다 (VC-016).</text>
<text x="940" y="602" class="s" >7.</text>
<text x="958" y="602" >투표 종료 뒤 순번·시각 없는 ParticipationSet만</text>
<text x="958" y="619" class="s" >보낸다 (VC-084). 이중 투표 조사는 §6.6.</text>
