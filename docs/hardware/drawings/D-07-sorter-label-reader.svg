<rect x="360" y="230" width="110" height="28" rx="2" class="tcb" />
<rect x="360" y="278" width="110" height="28" rx="2" class="tcb" />
<path d="M360,258 L360,264 M470,258 L470,264 M360,278 L360,272 M470,278 L470,272" class="ln" />
