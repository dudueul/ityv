<circle cx="1176" cy="344" r="5" class="seal" />
<rect x="850" y="300" width="100" height="60" rx="3" class="box" />
<text x="900" y="318" class="s" text-anchor="middle" >값 집합</text>
<text x="900" y="333" class="s" text-anchor="middle" >분류별, 낱개</text>
<text x="900" y="348" class="s" text-anchor="middle" >(restricted)</text>
<line x1="895" y1="238" x2="895" y2="300" class="one" marker-end="url(#at)" />
<circle cx="760" cy="240" r="2" class="dot" />
