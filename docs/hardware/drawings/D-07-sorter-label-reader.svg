<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960">
<title>D-07 개표소 분류기 확장과 수령 라벨 판독기</title>
<desc>개표소 투표지 분류기에 붙이는 각인 판독기와, 관외 회송 봉투를 열지 않고 라벨만 읽어 일방향 카세트에 넣는 수령 선관위 라벨 판독기의 개념도.</desc>
<style>
svg { color: #1b2430; --muted: #5a6878; --fill: rgba(27,36,48,.05); --fill2: rgba(29,114,125,.12); --chm: rgba(154,107,0,.12); --warn: #b81f2e; --teal: #1d727d; --gold: #8a6100; --paper: rgba(27,36,48,.03); }
@media (prefers-color-scheme: dark) {
  svg { color: #e5ebf1; --muted: #a3b1c0; --fill: rgba(229,235,241,.06); --fill2: rgba(76,193,204,.16); --chm: rgba(226,181,71,.14); --warn: #ef7a88; --teal: #5fd0db; --gold: #e2b547; --paper: rgba(229,235,241,.04); }
}
text { fill: currentColor; font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "IBM Plex Sans KR", sans-serif; font-size: 12px; }
.s { font-size: 11px; fill: var(--muted); }
.h { font-size: 16px; font-weight: 700; }
.h2 { font-size: 13px; font-weight: 700; }
.m { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; font-size: 11px; }
.red { fill: var(--warn); } .tl { fill: var(--teal); } .gd { fill: var(--gold); } .mu { fill: var(--muted); }
.ln { stroke: currentColor; fill: none; stroke-width: 1.4; }
.thin { stroke: currentColor; fill: none; stroke-width: .8; }
.dim { stroke: var(--muted); fill: none; stroke-width: .8; }
.ext { stroke: var(--muted); fill: none; stroke-width: .6; stroke-dasharray: 2 2; }
.box { stroke: currentColor; fill: var(--fill); stroke-width: 1.4; }
.paper { stroke: currentColor; fill: var(--paper); stroke-width: 1; }
.tcb { stroke: var(--teal); fill: var(--fill2); stroke-width: 1.6; }
.unt { stroke: var(--muted); fill: var(--fill); stroke-width: 1.4; stroke-dasharray: 6 4; }
.chm { stroke: var(--gold); fill: var(--chm); stroke-width: 1.6; }
.warn { stroke: var(--warn); fill: none; stroke-width: 1.6; }
.warnf { stroke: var(--warn); fill: none; stroke-width: 1.2; stroke-dasharray: 5 3; }
.one { stroke: var(--teal); fill: none; stroke-width: 2; }
.oned { stroke: var(--teal); fill: none; stroke-width: 2; stroke-dasharray: 7 4; }
.two { stroke: var(--muted); fill: none; stroke-width: 1.6; }
.seal { stroke: var(--warn); fill: none; stroke-width: 1.4; }
.sealf { fill: var(--warn); }
.zone { stroke: var(--warn); fill: none; stroke-width: 1; stroke-dasharray: 3 3; }
.dot { fill: currentColor; }
</style>
