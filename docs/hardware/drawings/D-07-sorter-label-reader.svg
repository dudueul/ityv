<text x="415" y="164" text-anchor="middle" style="font-size:11px;font-weight:700">4</text>
<circle cx="540" cy="290" r="2" class="dot" />
<line x1="540" y1="290" x2="560" y2="160" class="dim" />
<circle cx="560" cy="160" r="9" class="box" />
<text x="560" y="164" text-anchor="middle" style="font-size:11px;font-weight:700">5</text>
<circle cx="466" cy="330" r="2" class="dot" />
<line x1="466" y1="330" x2="600" y2="200" class="dim" />
<circle cx="600" cy="200" r="9" class="box" />
<text x="600" y="204" text-anchor="middle" style="font-size:11px;font-weight:700">6</text>
<text x="40" y="418" class="h2" >각인 판독기의 시야 (투표지 앞면)</text>
<rect x="60" y="436" width="300" height="100" rx="2" class="paper" />
<text x="210" y="480" class="s" text-anchor="middle" >기표란 · 후보 목록</text>
<text x="210" y="496" class="s" text-anchor="middle" >(판독기가 보지 않는 영역)</text>
<rect x="330" y="436" width="30" height="100" rx="0" class="tcb" />
<text x="345" y="560" class="s" text-anchor="middle" >각인 구역 18</text>
<rect x="312" y="428" width="56" height="116" rx="0" class="warnf" />
<text x="376" y="466" class="red" >센서 시야</text>
<text x="376" y="482" class="s" >(차폐로 제한)</text>
<text x="376" y="506" class="s" >Data Matrix</text>
<text x="376" y="522" class="s" >+ 사람이 읽는 48자</text>
<line x1="54" y1="486" x2="360" y2="486" class="ext" />
<text x="60" y="582" class="s" >지나가는 방향 → (투표지 하단이 판독기 쪽, 방향 처리는 가정)</text>
<text x="720" y="112" class="h2" >B. 수령 라벨 판독기와 일방향 카세트 (옆에서 본 개념)</text>
<rect x="720" y="130" width="660" height="250" rx="6" class="ext" />
<path d="M740,230 L810,230 L810,262 L740,262 Z" class="box" />
<text x="744" y="222" class="s" >봉투 투입</text>
<line x1="810" y1="248" x2="1360" y2="248" class="one" marker-end="url(#at)" />
