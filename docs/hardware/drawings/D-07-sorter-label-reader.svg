<text x="756" y="194" text-anchor="middle" style="font-size:11px;font-weight:700">7</text>
<circle cx="895" cy="218" r="2" class="dot" />
<line x1="895" y1="218" x2="895" y2="160" class="dim" />
<circle cx="895" cy="160" r="9" class="box" />
<text x="895" y="164" text-anchor="middle" style="font-size:11px;font-weight:700">8</text>
<circle cx="1050" cy="300" r="2" class="dot" />
<line x1="1050" y1="300" x2="1030" y2="160" class="dim" />
<circle cx="1030" cy="160" r="9" class="box" />
<text x="1030" y="164" text-anchor="middle" style="font-size:11px;font-weight:700">9</text>
<circle cx="1130" cy="248" r="2" class="dot" />
<line x1="1130" y1="248" x2="1130" y2="160" class="dim" />
<circle cx="1130" cy="160" r="9" class="box" />
<text x="1130" y="164" text-anchor="middle" style="font-size:11px;font-weight:700">10</text>
<circle cx="1340" cy="240" r="2" class="dot" />
<line x1="1340" y1="240" x2="1370" y2="210" class="dim" />
<circle cx="1370" cy="210" r="9" class="box" />
<text x="1370" y="214" text-anchor="middle" style="font-size:11px;font-weight:700">11</text>
<circle cx="1150" cy="350" r="2" class="dot" />
<line x1="1150" y1="350" x2="1100" y2="210" class="dim" />
<circle cx="1100" cy="210" r="9" class="box" />
<text x="1100" y="214" text-anchor="middle" style="font-size:11px;font-weight:700">12</text>
<circle cx="850" cy="330" r="2" class="dot" />
<line x1="850" y1="330" x2="820" y2="330" class="dim" />
<circle cx="820" cy="330" r="9" class="box" />
<text x="820" y="334" text-anchor="middle" style="font-size:11px;font-weight:700">13</text>
<text x="720" y="418" class="h2" >회송 봉투와 라벨 구역 (센서는 이 구역만 본다)</text>
<rect x="720" y="436" width="300" height="150" rx="3" class="paper" />
<text x="732" y="460" class="s" >수신 선관위 · 선거명</text>
<text x="732" y="476" class="s" >관리관 도장 · 봉함선</text>
<text x="732" y="568" class="s" >이름·주소·cast_id·추적코드 없음</text>
<rect x="956" y="444" width="52" height="134" rx="0" class="warnf" />
<rect x="960" y="448" width="44" height="60" rx="2" class="chm" />
<rect x="960" y="514" width="44" height="60" rx="2" class="chm" />
<rect x="968" y="458" width="28" height="28" rx="0" class="box" />
<text x="982" y="500" class="s" text-anchor="middle" >N개</text>
<text x="1030" y="458" class="s" >라벨 구역 40 × 120</text>
<text x="1030" y="474" class="s" >스티커 40 × 60, 두 장까지</text>
<text x="1030" y="490" class="s" >Data Matrix 20 × 20: env_label 1–8개</text>
<text x="1030" y="506" class="s" >"라벨 N개" + 각 라벨 앞 8자</text>
<text x="1030" y="530" class="s" >판독기는 봉투 외관을 찍지 않는다.</text>
<text x="1030" y="546" class="s" >어느 값들이 같은 스티커·봉투였는지</text>
<text x="1030" y="562" class="s" >남기지 않는다 (§10.6 1항).</text>
<text x="40" y="620" class="h2" >부품</text>
<circle cx="49" cy="638" r="8" class="thin" />
<text x="49" y="642" text-anchor="middle" style="font-size:11px">1</text>
<text x="64" y="642" >급지대</text>
<text x="220" y="642" class="s" >기존 분류기</text>
<circle cx="49" cy="656" r="8" class="thin" />
<text x="49" y="660" text-anchor="middle" style="font-size:11px">2</text>
<text x="64" y="660" >분리 롤러</text>
<text x="220" y="660" class="s" >기존</text>
<circle cx="49" cy="674" r="8" class="thin" />
<text x="49" y="678" text-anchor="middle" style="font-size:11px">3</text>
<text x="64" y="678" >기존 판독부</text>
<text x="220" y="678" class="s" >기표란 → 후보별 칸 (보조 수단)</text>
<circle cx="49" cy="692" r="8" class="thin" />
<text x="49" y="696" text-anchor="middle" style="font-size:11px">4</text>
<text x="64" y="696" >각인 판독기</text>
<text x="220" y="696" class="s" >각인 구역만 보는 라인 센서, 위·아래</text>
<circle cx="49" cy="710" r="8" class="thin" />
<text x="49" y="714" text-anchor="middle" style="font-size:11px">5</text>
<text x="64" y="714" >후보별 칸 · 미분류 칸</text>
<text x="220" y="714" class="s" >미분류는 사람 판정</text>
<circle cx="49" cy="728" r="8" class="thin" />
<text x="49" y="732" text-anchor="middle" style="font-size:11px">6</text>
<text x="64" y="732" >cast_id 목록 봉인 저장</text>
<text x="220" y="732" class="s" >restricted, 공개 안 함</text>
<circle cx="49" cy="746" r="8" class="thin" />
<text x="49" y="750" text-anchor="middle" style="font-size:11px">7</text>
<text x="64" y="750" >봉투 투입구</text>
<text x="220" y="750" class="s" >한 장씩</text>
<circle cx="479" cy="638" r="8" class="thin" />
<text x="479" y="642" text-anchor="middle" style="font-size:11px">8</text>
<text x="494" y="642" >라벨 구역 센서</text>
<text x="650" y="642" class="s" >스티커 구역만 (Data Matrix)</text>
<circle cx="479" cy="656" r="8" class="thin" />
<text x="479" y="660" text-anchor="middle" style="font-size:11px">9</text>
<text x="494" y="660" >분류 단추</text>
<text x="650" y="660" class="s" >훼손·기한 후·오배송은 사람이 누름</text>
<circle cx="479" cy="674" r="8" class="thin" />
<text x="479" y="678" text-anchor="middle" style="font-size:11px">10</text>
<text x="494" y="678" >분기 게이트</text>
<text x="650" y="678" class="s" >정상 → 카세트, 그 밖 → 예외</text>
<circle cx="479" cy="692" r="8" class="thin" />
<text x="479" y="696" text-anchor="middle" style="font-size:11px">11</text>
<text x="494" y="696" >일방향 카세트</text>
<text x="650" y="696" class="s" >넣을 수만 있음, 번호 봉인</text>
<circle cx="479" cy="710" r="8" class="thin" />
<text x="479" y="714" text-anchor="middle" style="font-size:11px">12</text>
<text x="494" y="714" >예외 봉투 칸</text>
<text x="650" y="714" class="s" >열지 않고 별도 봉인</text>
<circle cx="479" cy="728" r="8" class="thin" />
<text x="479" y="732" text-anchor="middle" style="font-size:11px">13</text>
<text x="494" y="732" >값 집합 저장</text>
<text x="650" y="732" class="s" >분류별 낱개 집합, restricted</text>
<text x="24" y="790" class="h2" >주</text>
<text x="24" y="808" class="s" >1. 분류기 출력은 수 셋뿐이다: 판독 성공 수, 각인 없음 수, 중복 cast_id 수. 각인 없음·중복은 DisputeEvent(2)로 간다 (BALLOT_LAYOUT §10).</text>
<text x="24" y="824" class="s" >2. 분류기 화면: 종이 수 = 기록 수 + 비상 투입 수의 양변과 차이. 법적 결과는 사람이 심사·계수한 종이 결과다 (SCREENS §4).</text>
<text x="24" y="840" class="s" >3. 각인 판독기는 기존 판독부와 장마다의 값을 주고받지 않는다. 분류기 화면에는 수 셋만 넘긴다 (가정).</text>
<text x="24" y="856" class="s" >4. ReceiptMark 공개부: 수령 선관위, 회차, 봉투·스티커·라벨 값 수, 라벨 값 집합의 Merkle root (§10.6).</text>
<text x="24" y="872" class="s" >5. 카세트를 열고 닫을 때 CassetteOpened·CassetteSealed를 남긴다 (§10.5). 개봉은 회차 단위, 봉투와 투표지를 섞은 뒤에만.</text>
<text x="24" y="888" class="s" >6. 센서 차폐, 방향 처리, 분류 단추, 카세트 구조는 가정이다.</text>
