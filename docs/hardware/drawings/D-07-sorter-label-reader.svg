<text x="624" y="376" class="s" text-anchor="middle" >미</text>
<line x1="500" y1="268" x2="500" y2="280" class="thin" />
<text x="570" y="398" class="s" text-anchor="middle" >후보별 칸 · 미분류</text>
<rect x="70" y="300" width="160" height="64" rx="3" class="paper" />
<rect x="72" y="352" width="156" height="10" rx="0" class="tcb" />
