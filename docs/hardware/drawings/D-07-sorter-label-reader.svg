<rect x="970" y="290" width="120" height="70" rx="3" class="box" />
<text x="978" y="308" class="s" >분류 단추 (사람)</text>
<text x="978" y="326" class="s" >훼손·개봉 흔적</text>
<text x="978" y="341" class="s" >기한 후 · 오배송</text>
