<text x="120" y="739" text-anchor="middle" style="font-weight:700">1</text>
<circle cx="230" cy="495" r="11" class="tcb" />
<text x="230" y="499" text-anchor="middle" style="font-weight:700">2</text>
<circle cx="300" cy="290" r="11" class="tcb" />
<text x="300" y="294" text-anchor="middle" style="font-weight:700">3</text>
<circle cx="650" cy="300" r="11" class="tcb" />
<text x="650" y="304" text-anchor="middle" style="font-weight:700">4</text>
<circle cx="745" cy="600" r="11" class="tcb" />
<text x="745" y="604" text-anchor="middle" style="font-weight:700">5</text>
<text x="940" y="124" class="h2" >유권자 동선</text>
<text x="940" y="146" class="s" >1 입구에서 확인 장치로. 신분증 확인 (사전투표면 명부 조회).</text>
<text x="940" y="163" class="s" >2 투표지와 가림 봉투를 받는다.</text>
<text x="940" y="180" class="s" >3 기표소에서 찍고, 받은 투표지 전부를 봉투에 넣는다.</text>
<text x="940" y="197" class="s" >4 투함 스캐너에 봉투째 넣고 넣기 또는 확인을 고른다 (D-02).</text>
<text x="940" y="214" class="s" >5 봉투를 돌려주고 나간다. 사무원이 봉투 안쪽을 본다.</text>
<text x="954" y="231" class="s" >관외는 반환 투표지를 회송 봉투에 넣고 사무원 앞에서</text>
<text x="954" y="248" class="s" >라벨 스티커를 붙인다.</text>
<text x="940" y="290" class="h2" >CCTV 구도 (ADR-0010 3항)</text>
<text x="940" y="312" class="s" >보이면 안 됨: 기표소 안, 기표면, 봉투 표면.</text>
<text x="954" y="329" class="s" >유권자 화면과 인쇄물 출구도 비추지 않는다 (가정).</text>
<text x="940" y="346" class="s" >보여야 함 (가정): 투표함 칸 문과 봉인, 모듈 칸 문,</text>
<text x="954" y="363" class="s" >비상 투입구, 예비 장치, 게이트웨이 외함.</text>
<text x="940" y="380" class="s" >영상은 비공개, 구간 해시를 장부에 앵커한다.</text>
<text x="940" y="418" class="h2" >연결 (모두 연결 목록에 선언, D-03·D-05·D-06)</text>
<text x="940" y="440" class="s" >스캐너 → 게이트웨이: 광, 한 방향</text>
<text x="940" y="457" class="s" >카운터 유닛 → 게이트웨이: 광, 한 방향</text>
<text x="940" y="474" class="s" >단말 → 카운터 유닛: 광커플러, 한 방향</text>
<text x="940" y="491" class="s" >단말 ↔ 명부 단자: 사전투표만, 탭 없음</text>
<text x="940" y="508" class="s" >게이트웨이 ↔ 바깥 회선 단자: 하나</text>
<text x="940" y="525" class="s" >관찰 탭: 장치 쪽 하나, 회선 쪽 하나 (송신 없음)</text>
<text x="940" y="542" class="s" >무선: 없음. 개시·정오·마감 무선 점검 (RfCheck)</text>
<rect x="940" y="570" width="26" height="13" rx="0" class="tcb" />
<text x="974" y="580" class="s" >검증 장치 (커밋먼트·카운터 유닛)</text>
<rect x="940" y="590" width="26" height="13" rx="0" class="unt" />
<text x="974" y="600" class="s" >불신 장치·탭</text>
<line x1="940" y1="616" x2="966" y2="616" class="one" marker-end="url(#at)" />
<text x="974" y="620" class="s" >광 회선, 한 방향</text>
<line x1="940" y1="636" x2="966" y2="636" class="oned" marker-end="url(#at)" />
<text x="974" y="640" class="s" >관찰 탭 분기</text>
<line x1="940" y1="656" x2="966" y2="656" class="two" marker-end="url(#am)" marker-start="url(#am)" />
<text x="974" y="660" class="s" >양방향 회선</text>
<circle cx="1183" cy="576" r="9" class="seal" />
<text x="1183" y="580" class="red" text-anchor="middle" style="font-size:11px;font-weight:700">S</text>
<text x="1204" y="580" class="s" >봉인된 예비·외함</text>
<rect x="1170" y="590" width="26" height="13" rx="0" class="chm" />
<text x="1204" y="600" class="s" >가림 봉투</text>
<rect x="1170" y="620" width="26" height="13" rx="0" class="zone" />
<text x="1204" y="630" class="s" >CCTV 금지 구역</text>
<rect x="1170" y="640" width="26" height="13" rx="0" class="ext" style="fill: var(--fill2); opacity:.55"/>
<text x="1204" y="650" class="s" >CCTV 시야</text>
<text x="24" y="830" class="h2" >주</text>
<text x="24" y="848" class="s" >1. 배치와 거리는 예시다 (가정). 기표소 입구는 스캐너와 참관인석을 향하지 않게 둔다 (가정).</text>
<text x="24" y="864" class="s" >2. 광 회선은 바닥 덮개 안으로 보내고, 개시 때 참관인이 끝에서 끝까지 따라가 본다 (가정).</text>
<text x="24" y="880" class="s" >3. 참관인은 확인 장치와 스캐너의 사무원 쪽을 볼 수 있어야 한다. 유권자의 기표나 봉투 안은 보지 않는다.</text>
<text x="24" y="896" class="s" >4. 예비 장치는 봉인한 채 둔다. 바꿀 때는 사무원 2인과 서로 다른 조직 참관인 2인이 입회한다.</text>
<rect x="954" y="812" width="430" height="132" rx="0" class="box" />
<text x="962" y="832" class="s" >도면 번호</text>
<text x="1046" y="832" >D-00</text>
<line x1="954" y1="837" x2="1384" y2="837" class="thin" />
<text x="962" y="852" class="s" >이름</text>
<text x="1046" y="852" class="h2" >투표소 배치와 연결</text>
<line x1="954" y1="857" x2="1384" y2="857" class="thin" />
<text x="962" y="872" class="s" >축척 · 단위</text>
<text x="1046" y="872" >축척 없음 (예시 배치) · mm</text>
<line x1="954" y1="877" x2="1384" y2="877" class="thin" />
<text x="962" y="892" class="s" >판 · 날짜</text>
<text x="1046" y="892" >1판 (연구용 초안) · 2026-11-01</text>
