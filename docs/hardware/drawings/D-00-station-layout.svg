<text x="24" y="34" class="h" >D-00 · 투표소 배치와 연결 (평면 예시)</text>
<text x="24" y="54" class="s" >예시 배치다. 실제 투표소마다 다르다. 번호는 유권자 동선 순서, 기호는 오른쪽 범례.</text>
<text x="24" y="70" class="s" >CCTV는 장치와 봉인을 비추고, 기표와 봉투 표면은 비추지 않는다 (ADR-0010 3항).</text>
