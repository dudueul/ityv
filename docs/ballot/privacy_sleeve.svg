<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" font-family="sans-serif" font-size="11">
  <title>가림 봉투와 투입 후드</title>
  <desc>Privacy sleeve (opaque folder, one open end) and the casting scanner feed hood. The ballot enters top-first so the imprint zone is at the open end; the hood pulls only the ballot, the sleeve stays outside.</desc>
  <!-- sleeve -->
  <g transform="translate(30,40)">
    <rect x="0" y="0" width="110" height="240" fill="#e8e6df" stroke="#333" stroke-width="1.5"/>
    <text x="55" y="-10" text-anchor="middle" fill="currentColor">가림 봉투 110 x 320 mm</text>
    <rect x="12" y="-18" width="86" height="236" fill="#fbfbf8" stroke="#333" stroke-width="1"/>
    <rect x="12" y="200" width="86" height="18" fill="#eef3ff"/>
    <text x="55" y="213" text-anchor="middle" fill="#557" font-size="8">각인 구역 (열린 끝 쪽)</text>
    <text x="55" y="60" text-anchor="middle" fill="#777" font-size="9">기표면 안쪽</text>
    <text x="55" y="76" text-anchor="middle" fill="#777" font-size="9">윗변부터 삽입</text>
    <path d="M55,-30 L55,-20" stroke="currentColor" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="55" y="262" text-anchor="middle" fill="currentColor" font-size="10">열린 끝 → 투입 후드로</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <!-- scanner -->
  <g transform="translate(230,30)">
    <rect x="0" y="0" width="380" height="300" fill="none" stroke="currentColor" stroke-width="1.5"/>
    <text x="190" y="-8" text-anchor="middle" fill="currentColor">투함 스캐너 (투표함 위)</text>
    <rect x="10" y="20" width="90" height="60" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="55" y="45" text-anchor="middle" fill="currentColor" font-size="9">투입 후드</text>
    <text x="55" y="60" text-anchor="middle" fill="currentColor" font-size="8">봉투 끝만 수용</text>
    <rect x="110" y="20" width="70" height="60" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="145" y="45" text-anchor="middle" fill="currentColor" font-size="9">롤러·양면</text>
    <text x="145" y="60" text-anchor="middle" fill="currentColor" font-size="9">스캔 헤드</text>
    <rect x="190" y="20" width="70" height="60" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="225" y="45" text-anchor="middle" fill="currentColor" font-size="9">대기 구역</text>
    <text x="225" y="60" text-anchor="middle" fill="currentColor" font-size="8">투입/검증 결정 대기</text>
    <rect x="270" y="20" width="70" height="60" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="305" y="45" text-anchor="middle" fill="currentColor" font-size="9">각인 헤드</text>
    <text x="305" y="60" text-anchor="middle" fill="currentColor" font-size="8">투입 시에만</text>
    <g stroke="currentColor" stroke-width="1.5" fill="none">
      <path d="M100,50 L110,50" marker-end="url(#arrow)"/>
      <path d="M180,50 L190,50" marker-end="url(#arrow)"/>
      <path d="M260,50 L270,50" marker-end="url(#arrow)"/>
      <path d="M305,80 L305,120" marker-end="url(#arrow)"/>
      <path d="M225,80 L225,120 L120,120 L120,200" marker-end="url(#arrow)"/>
      <path d="M305,140 L305,200" marker-end="url(#arrow)"/>
      <path d="M305,140 L360,140 L360,200" marker-end="url(#arrow)"/>
    </g>
    <text x="305" y="134" text-anchor="middle" fill="currentColor" font-size="9">분기기</text>
    <rect x="260" y="205" width="90" height="50" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="305" y="225" text-anchor="middle" fill="currentColor" font-size="9">투표함</text>
    <text x="305" y="240" text-anchor="middle" fill="currentColor" font-size="8">"투입" · 각인 후 낙하</text>
    <rect x="340" y="205" width="36" height="50" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="358" y="225" text-anchor="middle" fill="currentColor" font-size="8">반환</text>
    <text x="358" y="238" text-anchor="middle" fill="currentColor" font-size="8">트레이</text>
    <text x="358" y="250" text-anchor="middle" fill="currentColor" font-size="7">관외·재외</text>
    <rect x="75" y="205" width="90" height="50" fill="none" stroke="currentColor" stroke-width="1"/>
    <text x="120" y="225" text-anchor="middle" fill="currentColor" font-size="9">폐기 슈트</text>
    <text x="120" y="240" text-anchor="middle" fill="currentColor" font-size="8">"검증" · 각인 없음</text>
    <text x="190" y="285" text-anchor="middle" fill="currentColor" font-size="9">유권자 화면: "투입 / 검증" 선택 · 슬립 프린터(3단계) · 라벨 프린터(관외)</text>
  </g>
</svg>
