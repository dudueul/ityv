<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330" font-family="sans-serif" font-size="11">
  <title>관외·재외 회송용 봉투와 라벨 스티커 구역</title>
  <desc>Return envelope for out-of-district and overseas early voting. Existing elements stay; a 30x50 mm label sticker zone is added at the lower right, away from the seal flap. No voter name, no cast id, no tracking code.</desc>
  <g transform="translate(30,30)">
    <rect x="0" y="0" width="460" height="260" fill="#fbfbf8" stroke="#333" stroke-width="1.5"/>
    <!-- flap -->
    <path d="M0,0 L230,70 L460,0" fill="none" stroke="#333" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="230" y="40" text-anchor="middle" fill="#777" font-size="9">봉함선 (유권자가 사무원 앞에서 봉함)</text>
    <!-- destination -->
    <text x="20" y="110" fill="#111" font-weight="bold">회송용 봉투</text>
    <text x="20" y="128" fill="#111" font-size="10">수신: ○○시 ○○구 선거관리위원회 (관할 선관위 명칭·주소)</text>
    <text x="20" y="144" fill="#111" font-size="10">선거명: 제00대 ○○선거 · 관외사전투표</text>
    <rect x="20" y="160" width="70" height="40" fill="none" stroke="#333" stroke-width="1"/>
    <text x="55" y="184" text-anchor="middle" fill="#111" font-size="9">관리관 도장</text>
    <text x="20" y="225" fill="#111" font-size="9">유권자 이름·주소 없음 (현행 규격 가정)</text>
    <text x="20" y="240" fill="#111" font-size="9">cast_id·추적코드 없음</text>
    <!-- label sticker zone -->
    <rect x="300" y="150" width="140" height="90" fill="#eef3ff" stroke="#557" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="370" y="166" text-anchor="middle" fill="#557" font-size="9">라벨 스티커 구역 30x50 mm</text>
    <rect x="308" y="174" width="124" height="58" fill="#fff" stroke="#333" stroke-width="1"/>
    <text x="314" y="190" fill="#111" font-size="8" font-family="monospace">7C21E0 55A9B3 0D6F11</text>
    <text x="314" y="201" fill="#111" font-size="8" font-family="monospace">C8A2E7 3B9D04 F01A6C</text>
    <text x="314" y="212" fill="#111" font-size="8" font-family="monospace">9E5520 B7D3A1</text>
    <rect x="398" y="180" width="28" height="28" fill="#111"/>
    <rect x="402" y="184" width="20" height="20" fill="#fff"/>
    <rect x="404" y="186" width="5" height="5" fill="#111"/><rect x="413" y="186" width="4" height="4" fill="#111"/><rect x="404" y="196" width="4" height="4" fill="#111"/><rect x="412" y="195" width="6" height="6" fill="#111"/>
    <text x="370" y="228" text-anchor="middle" fill="#111" font-size="8">env_label = 모듈 기여 난수 (cast_id와 무관)</text>
  </g>
  <g fill="currentColor" font-size="10">
    <text x="30" y="312">수령 선관위는 봉투를 열지 않고 라벨만 읽어 ReceiptMark를 수록한다 (§10.6). 개봉은 분리·혼합 후.</text>
  </g>
</svg>
