<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" font-family="sans-serif" font-size="11">
  <title>투함 스캐너 데이터 흐름</title>
  <desc>Split casting scanner: untrusted interpretation unit, verified commitment unit, chamber modules X/Y/neutral, imprinter and printers, sealed journal, store-and-forward uplink. Public parts go to the cast record; private parts only into pad-encrypted share packages.</desc>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="currentColor"/></marker>
  </defs>
  <g fill="none" stroke="currentColor" stroke-width="1.3">
    <rect x="20" y="40" width="150" height="70" stroke-dasharray="5 3"/>
    <rect x="260" y="30" width="220" height="180"/>
    <rect x="560" y="20" width="130" height="60"/>
    <rect x="560" y="95" width="130" height="60"/>
    <rect x="560" y="170" width="130" height="60"/>
    <rect x="260" y="270" width="130" height="60"/>
    <rect x="420" y="270" width="130" height="60"/>
    <rect x="580" y="270" width="130" height="60"/>
    <rect x="260" y="380" width="200" height="60"/>
    <rect x="520" y="380" width="200" height="60"/>
    <rect x="20" y="380" width="200" height="60" stroke-dasharray="5 3"/>
  </g>
  <g fill="currentColor">
    <text x="95" y="62" text-anchor="middle" font-weight="bold">해석 유닛</text>
    <text x="95" y="78" text-anchor="middle" font-size="9">불신 · 이미지 → option_index</text>
    <text x="95" y="94" text-anchor="middle" font-size="9">단방향 링크</text>
    <text x="370" y="52" text-anchor="middle" font-weight="bold">커밋먼트 유닛 (no_std, 검증)</text>
    <text x="370" y="72" text-anchor="middle" font-size="9">r_j = Σ r_c,j · cast_id = H(cid_X‖cid_Y‖…)</text>
    <text x="370" y="88" text-anchor="middle" font-size="9">C_j = val_j(t)·G_val + cast_id·G_id + r_j·H</text>
    <text x="370" y="104" text-anchor="middle" font-size="9">π = 1-of-(m+2) OR 증명 (§7.5)</text>
    <text x="370" y="120" text-anchor="middle" font-size="9">선형 비밀분산 → 구성원 평문 share (§9.2)</text>
    <text x="370" y="136" text-anchor="middle" font-size="9">SharePackage 서명 → 해시 → CastRecord 서명</text>
    <text x="370" y="152" text-anchor="middle" font-size="9">추적코드 = H(CastRecord)</text>
    <text x="370" y="168" text-anchor="middle" font-size="9">화면 "투입 / 검증"</text>
    <text x="370" y="196" text-anchor="middle" font-size="9">처리 후 비밀값 소거 (VC-020)</text>
    <text x="625" y="42" text-anchor="middle" font-weight="bold">모듈 X</text>
    <text x="625" y="58" text-anchor="middle" font-size="9">난수·cid·lab·패드 XOR</text>
    <text x="625" y="72" text-anchor="middle" font-size="9">counter + pub_sig (공개)</text>
    <text x="625" y="117" text-anchor="middle" font-weight="bold">모듈 Y</text>
    <text x="625" y="133" text-anchor="middle" font-size="9">난수·cid·lab·패드 XOR</text>
    <text x="625" y="147" text-anchor="middle" font-size="9">counter + pub_sig (공개)</text>
    <text x="625" y="192" text-anchor="middle" font-weight="bold">모듈 J/A/C 또는 중립</text>
    <text x="625" y="208" text-anchor="middle" font-size="9">난수·패드 XOR</text>
    <text x="625" y="222" text-anchor="middle" font-size="9">위임 시 플래그 비트1</text>
    <text x="325" y="292" text-anchor="middle" font-weight="bold">각인기</text>
    <text x="325" y="308" text-anchor="middle" font-size="9">"투입" 시 cast_id 각인</text>
    <text x="325" y="322" text-anchor="middle" font-size="9">검증 시 각인 없음</text>
    <text x="485" y="292" text-anchor="middle" font-weight="bold">슬립 프린터</text>
    <text x="485" y="308" text-anchor="middle" font-size="9">3단계 · Slip(추적코드, 서명)</text>
    <text x="485" y="322" text-anchor="middle" font-size="9">ChallengeOpening 요약</text>
    <text x="645" y="292" text-anchor="middle" font-weight="bold">라벨 프린터</text>
    <text x="645" y="308" text-anchor="middle" font-size="9">관외·재외 봉투 스티커</text>
    <text x="645" y="322" text-anchor="middle" font-size="9">env_label (cast_id와 무관)</text>
    <text x="360" y="402" text-anchor="middle" font-weight="bold">봉인 저널 (sealed)</text>
    <text x="360" y="418" text-anchor="middle" font-size="9">record_hash, SharePackage 순서대로, fsync</text>
    <text x="360" y="432" text-anchor="middle" font-size="9">공개는 정렬 집합 root만 (VC-027)</text>
    <text x="620" y="402" text-anchor="middle" font-weight="bold">업링크 (저장 후 전달)</text>
    <text x="620" y="418" text-anchor="middle" font-size="9">CastRecord(public), SharePackage(sealed)</text>
    <text x="620" y="432" text-anchor="middle" font-size="9">ACK까지 보관 · 네트워크 없어도 투표 진행</text>
    <text x="120" y="402" text-anchor="middle" font-weight="bold">선관위 네트워크</text>
    <text x="120" y="418" text-anchor="middle" font-size="9">패드·평문 share 없음 (VC-035)</text>
    <text x="120" y="432" text-anchor="middle" font-size="9">패키지 평문을 얻을 수 없음</text>
    <text x="215" y="66" font-size="9">Interpretation{t}</text>
    <text x="495" y="46" font-size="9">Issue / ModuleIssue</text>
    <text x="495" y="200" font-size="9">평문 share → XOR → 암호문+태그</text>
    <text x="450" y="486" text-anchor="middle" font-size="10">공개 기록: 커밋먼트·증명·카운터·서명 · 비공개(패드 암호화): r_c, cid_c, lab_c, share, 모듈 태그 · 어디에도 없음: 선택 평문, 유권자, 시간</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#a)">
    <path d="M170,75 L258,75"/>
    <path d="M480,50 L558,50"/>
    <path d="M480,125 L558,125"/>
    <path d="M480,200 L558,200"/>
    <path d="M325,210 L325,268"/>
    <path d="M400,210 L470,268"/>
    <path d="M440,210 L620,268"/>
    <path d="M360,330 L360,378"/>
    <path d="M460,410 L518,410"/>
    <path d="M520,420 L222,420"/>
  </g>
</svg>
