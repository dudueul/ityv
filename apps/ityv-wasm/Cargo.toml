[package]
name = "ityv-wasm"
description = "ityv verification console's WebAssembly wrapper (outside the TCB): runs ityv-verify over a development bundle and returns a hand-written JSON report through a C ABI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `cdylib` for the browser (wasm32-unknown-unknown), `rlib` so that the
# simulator's tests read bundles through the same code the console runs.
[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

# Only workspace crates: no wasm-bindgen, no serde, no allocator crate.
[dependencies]
ityv-encoding = { path = "../../crates/ityv-encoding", version = "=0.1.0" }
ityv-crypto = { path = "../../crates/ityv-crypto", version = "=0.1.0" }
ityv-ledger = { path = "../../crates/ityv-ledger", version = "=0.1.0" }
ityv-state = { path = "../../crates/ityv-state", version = "=0.1.0" }
ityv-verify = { path = "../../crates/ityv-verify", version = "=0.1.0" }

# Outside the TCB (CONSTITUTION.md §0), so this crate sets its own lints:
# the workspace set minus `unsafe_code = forbid`. `unsafe` is denied
# everywhere except the one FFI module, which allows it item by item, and
# every unsafe block carries a SAFETY comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
module_name_repetitions = "allow"
too_many_lines = "allow"
