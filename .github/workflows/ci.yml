# ityv CI. Every job is a constitution gate (CONSTITUTION.md). A red job blocks
# merge; no job may be skipped to get green.
name: ci

# Pull requests are checked on the pull_request event; the push event covers
# the default branch after a merge. A newer run on the same branch cancels the
# older in-progress one so superseded commits do not hold runners.
on:
  push:
    branches: [next]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 2
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (constitution lint set)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: build, test, docs (V1)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: cargo build --locked --workspace
      - run: cargo test --locked --workspace
      - name: docs must be complete
        run: cargo doc --locked --no-deps --workspace
        env:
          RUSTDOCFLAGS: "-D warnings"

  no-std:
    name: no_std build (embedded target)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-encoding --target thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-crypto --target thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-ledger --target thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-cunit --target thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-state --target thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-verify --target thumbv7em-none-eabihf
      - run: cargo build --locked -p ityv-tsa --target thumbv7em-none-eabihf

  deny:
    name: cargo-deny (licenses, advisories, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      # The cargo-deny-action docker image bundles an older cargo-deny that
      # cannot parse CVSS 4.0 entries in the current RustSec advisory database
      # ("unsupported CVSS version: 4.0"). Pin the same version used locally.
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny --locked check

  vet:
    name: cargo-vet (supply-chain audits)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: cargo install --locked cargo-vet@0.10.3
      - run: cargo vet --locked

  kani:
    name: Kani bounded model checking (V2)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      # A per-harness timeout makes a regression fail fast instead of hanging
      # the job; the local runs record every harness well under a minute,
      # except ityv-tsa's tree-check and time-parser harnesses (two to four
      # minutes each).
      - uses: model-checking/kani-github-action@v1.1
        with:
          args: -p ityv-encoding -p ityv-crypto -p ityv-ledger -p ityv-cunit -p ityv-state -p ityv-verify -p ityv-tsa -Z unstable-options --harness-timeout 10m

  mutants:
    name: cargo-mutants (V1, advisory until the suite is complete)
    runs-on: ubuntu-24.04
    continue-on-error: true
    # Every mutant still runs; the larger crates are split into shards on
    # separate runners and each runner tests two mutants at a time, so the
    # whole workflow finishes in about an hour instead of over four. A
    # shard must stay well under the six-hour job limit: ityv-verify (whose
    # tests build real OR proofs) and ityv-state took close to three hours
    # in one shard, so they are split too. The audit stage (ADR-0036) added
    # about 180 mutants each to ityv-verify and ityv-encoding, whose slowest
    # shards had already reached four and three hours, so ityv-verify now has
    # five shards and ityv-encoding three. Timestamps and roll custody (ADR-0039,
    # ADR-0040) pushed one ityv-verify shard past the six-hour limit: shards
    # are now dealt round-robin, so slow mutants (the roll and tally tests)
    # spread evenly instead of landing in one consecutive slice, and
    # ityv-verify has eight shards of about three hours.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: ityv-encoding, shard: 0/3 }
          - { crate: ityv-encoding, shard: 1/3 }
          - { crate: ityv-encoding, shard: 2/3 }
          - { crate: ityv-crypto, shard: 0/2 }
          - { crate: ityv-crypto, shard: 1/2 }
          - { crate: ityv-ledger, shard: 0/1 }
          - { crate: ityv-cunit, shard: 0/4 }
          - { crate: ityv-cunit, shard: 1/4 }
          - { crate: ityv-cunit, shard: 2/4 }
          - { crate: ityv-cunit, shard: 3/4 }
          - { crate: ityv-state, shard: 0/2 }
          - { crate: ityv-state, shard: 1/2 }
          - { crate: ityv-verify, shard: 0/8 }
          - { crate: ityv-verify, shard: 1/8 }
          - { crate: ityv-verify, shard: 2/8 }
          - { crate: ityv-verify, shard: 3/8 }
          - { crate: ityv-verify, shard: 4/8 }
          - { crate: ityv-verify, shard: 5/8 }
          - { crate: ityv-verify, shard: 6/8 }
          - { crate: ityv-verify, shard: 7/8 }
          - { crate: ityv-tsa, shard: 0/1 }
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
      - run: cargo install --locked cargo-mutants@27.1.0
      - run: cargo mutants -p ${{ matrix.crate }} --shard ${{ matrix.shard }} --sharding round-robin --jobs 2 --timeout 300

  console:
    name: console (WASM verifier, scenario bundles, TypeScript)
    runs-on: ubuntu-24.04
    # Outside the TCB (ADR-0038): the WASM wrapper, the simulator's quick
    # scenario set and the read-only console. The Rust crates themselves
    # are covered by the clippy and test jobs above.
    env:
      ITYV_SIM_SET: quick
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          targets: wasm32-unknown-unknown
      - uses: oven-sh/setup-bun@v2.0.2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
        working-directory: apps/ityv-console
      - run: bunx tsc --noEmit
        working-directory: apps/ityv-console
      - run: bun test
        working-directory: apps/ityv-console
      # One path: builds the WASM verifier and the quick bundles
      # (scripts/data.ts), then bundles the page into dist/ with its CSP.
      - run: bun run build
        working-directory: apps/ityv-console
