[package]
name = "ityv-encoding"
description = "ityv canonical fixed-width binary encoding: no_std, no alloc, no unsafe, no panics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["encoding", "no-std", "no-std::no-alloc"]
keywords = ["encoding", "canonical", "election", "no_std"]

[lib]
doctest = true

# The library has no dependencies. Keep it that way: every dependency is a
# verification obligation (CONSTITUTION.md §1.10).
[dependencies]

[dev-dependencies]
proptest = { version = "1.9", default-features = false, features = ["std"] }

[lints]
workspace = true
