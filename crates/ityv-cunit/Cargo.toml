[package]
name = "ityv-cunit"
description = "ityv commitment unit: per-ballot typestate from interpretation to durable imprint, share packages over pad and KEM transport, sealed journal chain, batch attestation and box accounting; no_std, no alloc, no unsafe, no panics, no I/O"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["cryptography", "no-std", "no-std::no-alloc", "embedded"]
keywords = ["election", "commitment", "no_std"]

[lib]
doctest = true

# Only the sibling TCB crates plus the two traits the whole workspace already
# uses: randomness comes in through `rand_core` from the host, secrets are
# wiped with `zeroize`. No algorithm crate is imported here (ADR-0015 §1).
[dependencies]
ityv-encoding = { path = "../ityv-encoding", version = "=0.1.0" }
ityv-crypto = { path = "../ityv-crypto", version = "=0.1.0" }
ityv-ledger = { path = "../ityv-ledger", version = "=0.1.0" }
rand_core = { version = "=0.10.1", default-features = false }
zeroize = { version = "=1.9.1", default-features = false }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.10.0", default-features = false }

[lints]
workspace = true
