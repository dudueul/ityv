[package]
name = "ityv-ledger"
description = "ityv evidence ledger: RFC 9162-shaped SHA3-512 Merkle tree with incremental accumulator and proofs, frame chain rules and stream parser, witness checkpoint rules, quorum policy, publication deadlines; no_std, no alloc, no unsafe, no panics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
categories = ["cryptography", "no-std", "no-std::no-alloc", "data-structures"]
keywords = ["election", "merkle", "transparency-log", "no_std"]

[lib]
doctest = true

# Only the two sibling TCB crates. Hashing and signatures are reached through
# `ityv-crypto` (ADR-0015 §1); no algorithm crate is imported here.
[dependencies]
ityv-encoding = { path = "../ityv-encoding", version = "=0.1.0" }
ityv-crypto = { path = "../ityv-crypto", version = "=0.1.0" }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
rand_chacha = { version = "=0.10.0", default-features = false }

[lints]
workspace = true
