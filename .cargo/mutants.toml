# cargo-mutants configuration. Kani harnesses are compiled only under
# `cargo kani`, so mutating them cannot be observed by `cargo test`; they are
# verified by the Kani job instead.
exclude_globs = ["**/proofs.rs"]
# `Drop` implementations only zeroize secrets; a `Drop` body replaced with
# `()` is unobservable after the value is gone. Zeroize-on-drop is covered by
# the explicit `Zeroize` tests (tests/commit.rs `zeroize_clears_secret_types`)
# and by the `Zeroizing` guards, whose own `Drop` belongs to the zeroize crate.
# Three mutants are equivalent to the original program and stay excluded by
# name (crates/ityv-crypto/README.md, 검증): `Statement::proof_system_id`
# replaced by the constant 1 (the only proof system is 1) and
# `Sha3Backend::begin` replaced by `Default::default()` (a default SHA3
# state is a fresh state).
exclude_re = [
    "impl Drop",
    "Statement<'a>::proof_system_id",
    "Sha3Backend for RustCrypto>::begin",
    # Equivalent: two applied amendments never share a frame (a frame carries
    # one event), so `<` and `<=` between their frames agree
    # (crates/ityv-verify/src/index.rs, `amendment_frames`).
    "replace < with <= in LedgerIndex<'a>::amendment_frames",
    # Equivalent: a tick and a close never share a frame (a frame carries
    # one event), so `>` and `>=` between their frames agree
    # (crates/ityv-verify/src/progress.rs, `after_close`).
    "replace > with >= in after_close",
    # Equivalent: each compares the frames of two different ledger events
    # (a checkpoint and a tally scope; a receipt resolution and a legal
    # decision; a close, resolution or decision and a tally scope; a late
    # close and a tally scope). A frame carries one event, so the two are
    # never equal and `<`/`<=` (`>`/`>=`) agree
    # (crates/ityv-verify/src/tally.rs: `witness_time`, `apply_decision`,
    # `readiness`, `late_closes`).
    "replace < with <= in Ctx<'_, 'a>::witness_time",
    "replace < with <= in Work<'a>::apply_decision",
    "replace < with <= in Work<'a>::readiness",
    "replace > with >= in late_closes",
    # Equivalent: a paper count has one to 70 candidates (the constructor
    # and the decoder refuse none), so `PaperVotes::is_empty` is always
    # false; it exists because `len` needs it (clippy `len_without_is_empty`)
    # (crates/ityv-encoding/src/schema/tally.rs).
    "replace PaperVotes::is_empty -> bool with false",
]
# The workspace builds with `-D warnings`; a mutated body usually leaves a
# parameter unused, which would make most mutants unviable (fail to build)
# instead of testing whether the suite catches them. Cap lints for mutants.
cap_lints = true
timeout_multiplier = 3.0
