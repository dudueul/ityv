# cargo-mutants configuration. Kani harnesses are compiled only under
# `cargo kani`, so mutating them cannot be observed by `cargo test`; they are
# verified by the Kani job instead.
exclude_globs = ["**/proofs.rs"]
# `Drop` implementations only zeroize secrets; a `Drop` body replaced with
# `()` is unobservable after the value is gone. Zeroize-on-drop is covered by
# the explicit `Zeroize` tests (tests/commit.rs `zeroize_clears_secret_types`)
# and by the `Zeroizing` guards, whose own `Drop` belongs to the zeroize crate.
# Three mutants are equivalent to the original program and stay excluded by
# name (crates/ityv-crypto/README.md, 검증): `Statement::proof_system_id`
# replaced by the constant 1 (the only proof system is 1) and
# `Sha3Backend::begin` replaced by `Default::default()` (a default SHA3
# state is a fresh state).
exclude_re = [
    "impl Drop",
    "Statement<'a>::proof_system_id",
    "Sha3Backend for RustCrypto>::begin",
    # Equivalent: two applied amendments never share a frame (a frame carries
    # one event), so `<` and `<=` between their frames agree
    # (crates/ityv-verify/src/index.rs, `amendment_frames`).
    "replace < with <= in LedgerIndex<'a>::amendment_frames",
    # Equivalent: a tick and a close never share a frame (a frame carries
    # one event), so `>` and `>=` between their frames agree
    # (crates/ityv-verify/src/progress.rs, `after_close`).
    "replace > with >= in after_close",
    # Equivalent: each compares the frames of two different ledger events
    # (a checkpoint and a tally scope; a receipt resolution and a legal
    # decision; a close, resolution or decision and a tally scope; a late
    # close and a tally scope). A frame carries one event, so the two are
    # never equal and `<`/`<=` (`>`/`>=`) agree
    # (crates/ityv-verify/src/tally.rs: `witness_time`, `apply_decision`,
    # `readiness`, `late_closes`).
    "replace < with <= in Ctx<'_, 'a>::witness_time",
    "replace < with <= in Work<'a>::apply_decision",
    "replace < with <= in Work<'a>::readiness",
    "replace > with >= in late_closes",
    # Equivalent: each compares the frames of two different ledger events
    # (a finding and the comparison that called for it; a binding
    # checkpoint and the seed; a tally scope and the freeze), which never
    # share a frame, so `>`/`>=` and `<`/`<=` agree; each comparison carries
    # a comment saying so (crates/ityv-verify/src/audit.rs:
    # `DeviceAudit::followed_up`, `Work::take_seed`, `Work::take_freeze`).
    "replace > with >= in DeviceAudit<'_>::followed_up",
    "replace < with <= in Work<'a>::take_seed",
    "replace < with <= in Work<'a>::take_freeze",
    # Equivalent: a paper count has one to 70 candidates (the constructor
    # and the decoder refuse none), so `PaperVotes::is_empty` is always
    # false; it exists because `len` needs it (clippy `len_without_is_empty`)
    # (crates/ityv-encoding/src/schema/tally.rs).
    "replace PaperVotes::is_empty -> bool with false",
    # Equivalent: a timestamp authority has one to four pins (the
    # constructor and the decoder refuse none), so `TimestampPins::is_empty`
    # is always false; it exists because `len` needs it (clippy
    # `len_without_is_empty`) (crates/ityv-encoding/src/schema/timestamp.rs).
    "replace TimestampPins<'a>::is_empty -> bool with false",
    # Equivalent: a connectivity manifest has one to 256 entries and a
    # frame log one to 384 frames (the constructors and the decoders refuse
    # none), so `ManifestEntries::is_empty` and `LogFrames::is_empty` are
    # always false; they exist because `len` needs them (clippy
    # `len_without_is_empty`) (crates/ityv-encoding/src/schema/connectivity.rs).
    "replace ManifestEntries<'a>::is_empty -> bool with false",
    "replace LogFrames<'a>::is_empty -> bool with false",
    # Equivalent: a timestamp record and the event it stamps are two ledger
    # events, which never share a frame (a frame carries one event; a record
    # cannot carry its own hash), so `<` and `<=` between their frames agree
    # (crates/ityv-verify/src/timestamp.rs, `verify_timestamps`).
    "replace < with <= in verify_timestamps",
    # Equivalent: the events a timestamp record can name are kept in a map
    # filtered to the three schemas only to save memory. A record's target
    # schema is one of those three (the decoder refuses any other, VC-117,
    # Kani `timestamp_rules_are_exact`) and must equal the event's, so an
    # unfiltered map finds the same targets
    # (crates/ityv-verify/src/timestamp.rs, `stamped_schema`).
    "replace stamped_schema -> bool with true",
    # Equivalent: a custody receipt and the freeze or amendment it answers
    # are two ledger events, which never share a frame, so `<` and `<=`
    # between their frames agree (crates/ityv-verify/src/roll.rs,
    # `Work::subject`).
    "replace < with <= in Work<'_, 'a>::subject",
    # Equivalent: an amendment and the event that marks the poll close (a
    # participation set, a final observer count or a box close) are two
    # ledger events, which never share a frame, so `<` and `<=` (`>` and
    # `>=`) between their frames agree; each comparison
    # carries a comment saying so (crates/ityv-verify/src/roll.rs:
    # `RollStage::roll`, `settle_close`).
    "replace < with <= in RollStage<'a>::roll",
    "replace > with >= in settle_close",
]
# The workspace builds with `-D warnings`; a mutated body usually leaves a
# parameter unused, which would make most mutants unviable (fail to build)
# instead of testing whether the suite catches them. Cap lints for mutants.
cap_lints = true
timeout_multiplier = 3.0
